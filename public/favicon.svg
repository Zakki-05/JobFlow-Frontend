<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container Rounded Box -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner Subtle Border -->
  <rect x="5" y="5" width="54" height="54" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Stylized "JF" Monogram + Growth Node Pattern -->
  <g fill="#ffffff">
    <!-- Letter J -->
    <path d="M 22 20 L 27 20 L 27 36 C 27 41 24 43 19 43 C 16 43 14 42 13 40.5 L 15.5 37 C 16.5 38 17.5 38.5 19 38.5 C 21 38.5 22 37.5 22 35.5 Z" />

    <!-- Letter F -->
    <path d="M 31 20 L 46 20 L 46 24.5 L 36 24.5 L 36 29.5 L 44 29.5 L 44 34 L 36 34 L 36 43 L 31 43 Z" />
  </g>

  <!-- Career Upward Growth Sparkle Node -->
  <path d="M 45 14 L 47 18 L 51 20 L 47 22 L 45 26 L 43 22 L 39 20 L 43 18 Z" fill="url(#accentGrad)" />
</svg>